name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile conventional Python sources
        run: |
          python - <<'PY'
          from pathlib import Path

          # This export is intended for Google Colab/IPython and contains
          # notebook magics (!pip), so it is not a standalone Python module.
          excluded = Path("scripts/sistemas_inteligentes_entregavel.py")
          sources = [
              path
              for root in (Path("scripts"), Path("tests"))
              for path in root.rglob("*.py")
              if path != excluded
          ]
          for path in sources:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print(f"Compiled {len(sources)} conventional Python files.")
          PY
      - name: Run test suite
        run: python -m pytest -q
